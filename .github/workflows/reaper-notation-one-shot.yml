name: REAPER Notation - One Shortcut Tests
on:
  pull_request:
    paths:
      - 'REAPER Notation - 4 Takte und Instrumentenschluessel.lua'
      - 'tests/test_reaper_notation_four_bars.lua'
      - '.github/workflows/reaper-notation-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua interpreter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Validate script syntax
        run: luac5.4 -p 'REAPER Notation - 4 Takte und Instrumentenschluessel.lua'
      - name: Validate test syntax
        run: luac5.4 -p tests/test_reaper_notation_four_bars.lua
      - name: Execute isolated ReaScript mock
        run: lua5.4 tests/test_reaper_notation_four_bars.lua
