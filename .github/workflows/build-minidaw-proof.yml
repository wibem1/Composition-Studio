name: Build MiniDAW Functional Test

on:
  workflow_dispatch:
  push:
    branches: [minidaw-functional-test]
    paths:
      - 'native/Sources/MiniDAW.swift'
      - 'native/EngineBridge/**'
      - 'native/upstream.env'
      - '.github/workflows/build-minidaw-proof.yml'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: studio }

      - name: Read MAGDA revision
        id: upstream
        shell: bash
        run: |
          source studio/native/upstream.env
          echo "repo=$MAGDA_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$MAGDA_REF" >> "$GITHUB_OUTPUT"

      - name: Restore MAGDA build workspace
        id: magda-cache
        uses: actions/cache@v4
        with:
          path: upstream
          key: minidaw-magda-workspace-${{ runner.os }}-x86_64-${{ steps.upstream.outputs.ref }}-v1

      - name: Checkout MAGDA
        if: steps.magda-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream.outputs.repo }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream
          submodules: false
          lfs: true
          fetch-depth: 1

      - name: Prepare MAGDA dependencies
        if: steps.magda-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream lfs pull
          git -C upstream submodule sync
          git -C upstream submodule update --init --depth 1 third_party/JUCE third_party/tracktion_engine third_party/juce-llm third_party/llama.cpp third_party/faust third_party/eurorack third_party/asiosdk
          git -C upstream/third_party/faust submodule sync
          git -C upstream/third_party/faust submodule update --init --depth 1 libraries

      - name: Ensure build tools
        shell: bash
        run: command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Install current MiniDAW bridge source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/composition_studio_bridge
          cp -R studio/native/EngineBridge upstream/composition_studio_bridge
          grep -q 'add_subdirectory(composition_studio_bridge)' upstream/CMakeLists.txt || printf '\nadd_subdirectory(composition_studio_bridge)\n' >> upstream/CMakeLists.txt

      - name: Configure
        working-directory: upstream
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DMAGDA_BUILD_TESTS=OFF -DMAGDA_BUILD_EXAMPLES=OFF -DMAGDA_BUILD_JUCE_ADAPTER=OFF -DMAGDA_BUILD_FAUST_VEC_BENCH=OFF -DMAGDA_HAVE_CLAP=OFF

      - name: Build bridge incrementally
        working-directory: upstream
        run: cmake --build build --target CompositionStudioEngineBridge -j $(sysctl -n hw.ncpu)

      - name: Verify bridge
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=$(find upstream/build -type f -name 'libCompositionStudioEngineBridge.dylib' -print -quit)
          test -n "$BRIDGE"
          file "$BRIDGE" | grep -q x86_64
          mkdir -p engine-out
          cp "$BRIDGE" engine-out/libCompositionStudioEngineBridge.dylib

      - name: Build MiniDAW app
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NO="$GITHUB_RUN_NUMBER"
          APP='dist/MiniDAW Functional Test.app'; MACOS="$APP/Contents/MacOS"; FW="$APP/Contents/Frameworks"; mkdir -p "$MACOS" "$FW"
          cp engine-out/libCompositionStudioEngineBridge.dylib "$FW/"
          install_name_tool -id '@rpath/libCompositionStudioEngineBridge.dylib' "$FW/libCompositionStudioEngineBridge.dylib"
          cp studio/native/Sources/MiniDAW.swift /tmp/main.swift
          printf '\nlet miniDAWBuildNumber = "%s"\n' "$BUILD_NO" >> /tmp/main.swift
          xcrun swiftc -target x86_64-apple-macosx11.0 -O -framework AppKit /tmp/main.swift -L "$FW" -lCompositionStudioEngineBridge -Xlinker -rpath -Xlinker '@executable_path/../Frameworks' -o "$MACOS/MiniDAW Functional Test"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>MiniDAW Functional Test</string><key>CFBundleIdentifier</key><string>net.klangwerke.MiniDAWFunctionalTest</string><key>CFBundleName</key><string>MiniDAW Functional Test</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleVersion</key><string>${BUILD_NO}</string><key>CFBundleShortVersionString</key><string>0.1.${BUILD_NO}</string><key>LSMinimumSystemVersion</key><string>11.0</string><key>NSHighResolutionCapable</key><true/></dict></plist>
          PLIST

      - name: Runtime preflight - engine and audio core
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/minidaw_preflight.cpp <<'CPP'
          #include <chrono>
          #include <iostream>
          #include <thread>
          extern "C" {
          bool cs_engine_initialize();
          void cs_engine_shutdown();
          int md_create_test_session();
          bool md_direct_audio_start();
          void md_direct_audio_stop();
          void md_direct_audio_test_tone(double);
          unsigned long long md_direct_audio_callbacks();
          double md_direct_audio_peak();
          double md_direct_audio_energy();
          int md_direct_audio_active_outputs();
          }
          int main() {
              if (!cs_engine_initialize()) { std::cerr << "FAIL engine initialization\n"; return 10; }
              const int track = md_create_test_session();
              if (track < 0) { std::cerr << "FAIL test session creation\n"; cs_engine_shutdown(); return 11; }
              std::cout << "PASS engine initialized; test track=" << track << "\n";
              // Hosted macOS runners may expose no physical CoreAudio output. If one is
              // available, exercise the complete direct JUCE callback path and require
              // measurable non-silent samples. If none is available, report this explicitly;
              // the physical-device check remains the only manual acceptance item.
              if (md_direct_audio_start()) {
                  const auto before = md_direct_audio_callbacks();
                  md_direct_audio_test_tone(0.35);
                  std::this_thread::sleep_for(std::chrono::milliseconds(700));
                  const auto after = md_direct_audio_callbacks();
                  const auto peak = md_direct_audio_peak();
                  const auto energy = md_direct_audio_energy();
                  const auto outputs = md_direct_audio_active_outputs();
                  md_direct_audio_stop();
                  std::cout << "Audio callbacks=" << after << " outputs=" << outputs << " peak=" << peak << " energy=" << energy << "\n";
                  if (outputs <= 0 || after <= before || peak <= 0.001 || energy <= 0.0) {
                      std::cerr << "FAIL direct audio callback/signal preflight\n"; cs_engine_shutdown(); return 12;
                  }
                  std::cout << "PASS direct audio callback and non-silent signal\n";
              } else {
                  std::cout << "SKIP physical CoreAudio signal: hosted runner has no usable output device\n";
              }
              cs_engine_shutdown();
              std::cout << "PASS clean engine shutdown\n";
              return 0;
          }
          CPP
          clang++ -std=c++17 -arch x86_64 -mmacosx-version-min=11.0 /tmp/minidaw_preflight.cpp -L engine-out -lCompositionStudioEngineBridge -Wl,-rpath,"$PWD/engine-out" -o /tmp/minidaw_preflight
          /tmp/minidaw_preflight | tee /tmp/minidaw-preflight.txt
          grep -q 'PASS engine initialized' /tmp/minidaw-preflight.txt
          grep -q 'PASS clean engine shutdown' /tmp/minidaw-preflight.txt

      - name: Runtime preflight - packaged app launches
        shell: bash
        run: |
          set -euo pipefail
          EXE='dist/MiniDAW Functional Test.app/Contents/MacOS/MiniDAW Functional Test'
          "$EXE" >/tmp/minidaw-app.log 2>&1 &
          PID=$!
          sleep 4
          if ! kill -0 "$PID" 2>/dev/null; then
            echo 'FAIL packaged app terminated during launch preflight'
            cat /tmp/minidaw-app.log
            wait "$PID" || true
            exit 20
          fi
          kill "$PID"
          wait "$PID" || true
          echo 'PASS packaged app remained alive after launch'

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - 'dist/MiniDAW Functional Test.app/Contents/Frameworks/libCompositionStudioEngineBridge.dylib'
          codesign --force --deep --sign - 'dist/MiniDAW Functional Test.app'
          plutil -lint 'dist/MiniDAW Functional Test.app/Contents/Info.plist'
          file 'dist/MiniDAW Functional Test.app/Contents/MacOS/MiniDAW Functional Test' | grep -q x86_64
          otool -L 'dist/MiniDAW Functional Test.app/Contents/MacOS/MiniDAW Functional Test' | grep -q libCompositionStudioEngineBridge
          codesign --verify --deep --strict 'dist/MiniDAW Functional Test.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/MiniDAW Functional Test.app' "dist/MiniDAW-Functional-Test-B${GITHUB_RUN_NUMBER}-Intel.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MiniDAW-Functional-Test-B${{ github.run_number }}-Intel
          path: dist/MiniDAW-Functional-Test-B${{ github.run_number }}-Intel.zip
          retention-days: 30
