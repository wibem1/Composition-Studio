name: REAPER Lua syntax
on:
  push:
    paths:
      - 'Composition Studio.lua'
      - '.github/workflows/lua-syntax.yml'
  workflow_dispatch:
jobs:
  lua-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua interpreter
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.4
          else
            brew install lua
          fi
      - name: Parse REAPER script
        shell: bash
        run: luac -p 'Composition Studio.lua'
