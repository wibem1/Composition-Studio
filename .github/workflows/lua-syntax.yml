name: REAPER Lua syntax and JSON bridge
on:
  push:
    paths:
      - 'Composition Studio.lua'
      - 'tests/json-bridge-test.lua'
      - '.github/workflows/lua-syntax.yml'
  workflow_dispatch:
jobs:
  lua-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua interpreter
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.4
          else
            brew install lua@5.4
          fi
      - name: Parse REAPER script
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$(brew --prefix lua@5.4)/bin/luac" -p 'Composition Studio.lua'
          else
            luac -p 'Composition Studio.lua'
          fi
      - name: Verify JSON bridge without API or REAPER
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$(brew --prefix lua@5.4)/bin/lua" tests/json-bridge-test.lua
          else
            lua tests/json-bridge-test.lua
          fi
