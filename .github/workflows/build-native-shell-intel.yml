name: Build Composition Studio V0.6 Intel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/Sources/**'
      - 'native/EngineBridge/**'
      - 'native/upstream.env'
      - '.github/workflows/build-native-shell-intel.yml'

concurrency:
  group: composition-studio-native-intel
  cancel-in-progress: true

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout Composition Studio
        uses: actions/checkout@v4
        with:
          path: studio

      - name: Read pinned MAGDA revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          source studio/native/upstream.env
          echo "repo=$MAGDA_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$MAGDA_REF" >> "$GITHUB_OUTPUT"
          echo "version=$COMPOSITION_STUDIO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout MAGDA engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream.outputs.repo }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream
          submodules: false
          lfs: true
          fetch-depth: 1

      - name: Ensure MAGDA LFS assets are present
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream lfs pull

      - name: Initialise required MAGDA dependencies
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream submodule sync
          git -C upstream submodule update --init --depth 1 \
            third_party/JUCE \
            third_party/tracktion_engine \
            third_party/juce-llm \
            third_party/llama.cpp \
            third_party/faust \
            third_party/eurorack \
            third_party/asiosdk

          # MAGDA's Faust DSP compilation needs stdfaust.lib. It lives in the
          # Faust repository's dedicated libraries submodule. Initialise only
          # that nested dependency instead of recursing through all Faust tools.
          git -C upstream/third_party/faust submodule sync
          git -C upstream/third_party/faust submodule update --init --depth 1 libraries

      - name: Install Ninja if needed
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      # Keep the expensive MAGDA/Tracktion/Faust compilation between runs.
      # The key changes only when the pinned MAGDA revision or fundamental
      # engine build settings change. Composition Studio Swift/bridge edits
      # therefore reuse the already compiled engine and rebuild only what is dirty.
      - name: Restore MAGDA engine build cache
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: upstream/build
          key: magda-engine-${{ runner.os }}-x86_64-${{ steps.upstream.outputs.ref }}-macos11-release-v2

      - name: Add Composition Studio EngineBridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/composition_studio_bridge
          cp -R studio/native/EngineBridge upstream/composition_studio_bridge
          if ! grep -q '^add_subdirectory(composition_studio_bridge)$' upstream/CMakeLists.txt; then
            printf '\nadd_subdirectory(composition_studio_bridge)\n' >> upstream/CMakeLists.txt
          fi

      - name: Configure engine for Intel
        working-directory: upstream
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMAGDA_BUILD_TESTS=OFF \
            -DMAGDA_BUILD_EXAMPLES=OFF \
            -DMAGDA_BUILD_JUCE_ADAPTER=OFF \
            -DMAGDA_BUILD_FAUST_VEC_BENCH=OFF \
            -DMAGDA_HAVE_CLAP=OFF \
            -DMAGDA_FULL_VERSION="${{ steps.upstream.outputs.version }}"

      - name: Build CompositionStudioCore
        working-directory: upstream
        shell: bash
        run: cmake --build build --target CompositionStudioEngineBridge -j $(sysctl -n hw.ncpu)

      # Save immediately after the expensive engine build, so the cache is kept
      # even if a later Swift/link/package step fails.
      - name: Save MAGDA engine build cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/build
          key: magda-engine-${{ runner.os }}-x86_64-${{ steps.upstream.outputs.ref }}-macos11-release-v2

      - name: Locate EngineBridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=$(find upstream/build -type f -name 'libCompositionStudioEngineBridge.dylib' -print -quit)
          if [ -z "$BRIDGE" ]; then
            echo 'CompositionStudio EngineBridge dylib not found'
            find upstream/build -type f -name '*CompositionStudioEngineBridge*' -print || true
            exit 1
          fi
          echo "path=$BRIDGE" >> "$GITHUB_OUTPUT"
          file "$BRIDGE"

      - name: Build Composition Studio application
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.upstream.outputs.version }}'
          APP='dist/Composition Studio.app'
          MACOS="$APP/Contents/MacOS"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$MACOS" "$FRAMEWORKS"

          BRIDGE='${{ steps.bridge.outputs.path }}'
          cp "$BRIDGE" "$FRAMEWORKS/"
          install_name_tool -id '@rpath/libCompositionStudioEngineBridge.dylib' "$FRAMEWORKS/libCompositionStudioEngineBridge.dylib"

          {
            cat studio/native/Sources/EngineBridge.swift
            cat studio/native/Sources/EngineHooks.swift
            echo 'installCompositionStudioEngineHooks()'
            cat studio/native/Sources/CompositionStudioApp.swift
          } > /tmp/CompositionStudioApp.swift

          xcrun swiftc \
            -target x86_64-apple-macosx11.0 \
            -O \
            -framework AppKit \
            -framework UniformTypeIdentifiers \
            /tmp/CompositionStudioApp.swift \
            -L "$FRAMEWORKS" \
            -lCompositionStudioEngineBridge \
            -Xlinker -rpath -Xlinker '@executable_path/../Frameworks' \
            -o "$MACOS/Composition Studio"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Composition Studio</string>
            <key>CFBundleIdentifier</key><string>net.klangwerke.CompositionStudio</string>
            <key>CFBundleName</key><string>Composition Studio</string>
            <key>CFBundleDisplayName</key><string>Composition Studio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Composition Studio benötigt Mikrofonzugriff für Audioaufnahmen.</string>
          </dict></plist>
          PLIST

          file "$MACOS/Composition Studio"
          lipo -info "$MACOS/Composition Studio"
          otool -L "$MACOS/Composition Studio"

      - name: Ad-hoc sign application
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - 'dist/Composition Studio.app/Contents/Frameworks/libCompositionStudioEngineBridge.dylib'
          codesign --force --deep --sign - 'dist/Composition Studio.app'

      - name: Package Intel build
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.upstream.outputs.version }}'
          ZIP="dist/Composition-Studio-V${VERSION}-Intel.zip"
          ditto -c -k --sequesterRsrc --keepParent 'dist/Composition Studio.app' "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh dist/
        id: package

      - name: Upload Intel build
        uses: actions/upload-artifact@v4
        with:
          name: Composition-Studio-V${{ steps.upstream.outputs.version }}-Intel
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          retention-days: 30
