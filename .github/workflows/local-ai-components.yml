name: Local AI component regression
on:
  push:
    branches: [feat/local-ai-manager-ddsp-1.6.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install lupa==2.5
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Diagnose artifact parity on failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from build_studio import artifacts
          for name, content in artifacts().items():
              expected = content.encode('utf-8')
              actual = Path(name).read_bytes()
              if actual != expected:
                  i = next((i for i, (a, b) in enumerate(zip(actual, expected)) if a != b), min(len(actual), len(expected)))
                  print(name, 'actual', len(actual), 'expected', len(expected), 'first diff', i)
                  print('actual:', repr(actual[max(0, i-80):i+160]))
                  print('expected:', repr(expected[max(0, i-80):i+160]))
          PY
      - run: python tools/build_studio.py --check
      - run: python tools/test_modular_build.py
      - run: python tools/test_version_module.py
      - run: luac5.4 -p 'Composition Studio.lua'
