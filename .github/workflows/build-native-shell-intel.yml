name: Build Composition Studio Native Shell Intel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/Sources/**'
      - '.github/workflows/build-native-shell-intel.yml'

concurrency:
  group: composition-studio-native-shell-intel
  cancel-in-progress: true

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout Composition Studio
        uses: actions/checkout@v4
      - name: Build Intel native app
        shell: bash
        run: |
          set -euo pipefail
          APP='dist/Composition Studio.app'
          MACOS="$APP/Contents/MacOS"
          mkdir -p "$MACOS"
          xcrun swiftc -target x86_64-apple-macosx11.0 -O -framework AppKit native/Sources/main.swift -o "$MACOS/Composition Studio"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Composition Studio</string>
            <key>CFBundleIdentifier</key><string>de.klangwerke.compositionstudio</string>
            <key>CFBundleName</key><string>Composition Studio</string>
            <key>CFBundleDisplayName</key><string>Composition Studio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.3.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          file "$MACOS/Composition Studio"
          lipo -info "$MACOS/Composition Studio"
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - 'dist/Composition Studio.app'
      - name: Package
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/Composition Studio.app' 'dist/Composition-Studio-V0.3-Native-Shell-Intel.zip'
          shasum -a 256 'dist/Composition-Studio-V0.3-Native-Shell-Intel.zip' > 'dist/Composition-Studio-V0.3-Native-Shell-Intel.zip.sha256'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Composition-Studio-V0.3-Native-Shell-Intel
          path: |
            dist/Composition-Studio-V0.3-Native-Shell-Intel.zip
            dist/Composition-Studio-V0.3-Native-Shell-Intel.zip.sha256
          retention-days: 30
