name: Notation Studio score preview smoke tests
on:
  push:
    branches: [feat/notation-score-preview-20261101]
    paths:
      - 'experimental/score-preview/**'
      - '.github/workflows/notation-score-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-visual-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Syntax check
        run: |
          luac5.4 -p "experimental/score-preview/score_preview_core.lua"
          luac5.4 -p "experimental/score-preview/Notation Studio - Notenbild Test.lua"
      - name: Read-only score model and ReaImGui mock
        run: |
          lua5.4 experimental/score-preview/tests/test_core.lua
          lua5.4 experimental/score-preview/tests/test_gui_mock.lua
