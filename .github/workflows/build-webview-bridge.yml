name: Build Composition Studio WebView Bridge x86_64

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_reaper_webview_bridge.py'
      - '.github/workflows/build-webview-bridge.yml'

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone reaper_webview v0.2.0
        run: |
          git clone --branch v0.2.0 --depth 1 --recurse-submodules https://github.com/SadFrozz/reaper_webview.git reaper_webview

      - name: Apply Composition Studio bridge
        run: |
          python3 tools/patch_reaper_webview_bridge.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("reaper_webview/CMakeLists.txt")
          s=p.read_text()
          marker="project(reaper_webview VERSION 0.2.0 LANGUAGES C CXX)"
          s=s.replace(marker, 'set(CMAKE_OSX_ARCHITECTURES "x86_64" CACHE STRING "Forced by Composition Studio" FORCE)\n'+marker, 1)
          p.write_text(s)
          PY

      - name: Build x86_64 dylib
        run: |
          cmake -S reaper_webview -B build-webview -DCMAKE_BUILD_TYPE=Release
          cmake --build build-webview --config Release --target reaper_webview -j 3
          file build-webview/reaper_webview.dylib
          lipo -info build-webview/reaper_webview.dylib
          lipo build-webview/reaper_webview.dylib -verify_arch x86_64

      - name: Package
        run: |
          mkdir -p artifact
          cp build-webview/reaper_webview.dylib artifact/reaper_webview.dylib
          printf '%s\n' "Composition Studio bridge build based on reaper_webview v0.2.0" > artifact/README.txt
          shasum -a 256 artifact/reaper_webview.dylib > artifact/SHA256SUMS.txt
          cd artifact && zip -r ../Composition-Studio-WebView-Bridge-macos-x86_64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Composition-Studio-WebView-Bridge-macos-x86_64
          path: Composition-Studio-WebView-Bridge-macos-x86_64.zip
          retention-days: 30
